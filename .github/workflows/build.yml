name: Build firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The default cloud_config.h does not exist in CI (it is git-ignored).
      # Use the example so the cloud code paths still compile.
      - name: Provide example cloud config
        run: cp cloud_config.example.h cloud_config.h

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32:PartitionScheme=huge_app
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          libraries: |
            - ArduinoIoTCloud
          sketch-paths: |
            - .
          enable-deltas-report: false
          enable-size-deltas-report: false
