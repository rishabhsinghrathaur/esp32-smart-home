name: Build firmware

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cloud_config.h is git-ignored, so CI uses the example template.
      # This keeps the cloud code paths part of the compile check.
      - name: Provide example cloud config
        run: cp cloud_config.example.h cloud_config.h

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install ArduinoIoTCloud

      - name: Compile
        run: arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app .
